name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce (Python path)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Runs the documented clone-and-run stamp. Optional provers (z3, coq,
      # isabelle, fstar, rust) are not installed here, so only the Python
      # checks run; reproduce.py skips provers that are not on PATH.
      - name: Run scripts/reproduce.py
        run: python scripts/reproduce.py
      - name: Show regenerated artifacts (informational)
        if: always()
        run: git diff --stat
